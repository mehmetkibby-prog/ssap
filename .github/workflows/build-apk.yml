name: Build Samsung Tab S10 FE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify source data
        run: |
          test -s app/src/main/assets/reis_genel_kultur_251.json
          python3 - <<'PY'
          import json
          p='app/src/main/assets/reis_genel_kultur_251.json'
          d=json.load(open(p,encoding='utf-8'))
          assert len(d)==409, f"Genel Kültür beklenen 409, bulunan {len(d)}"
          print("Genel Kültür:",len(d))
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/reis_genel_kultur_251.json'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sivil-Savunma-Samsung-Tab-S10FE-v2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
